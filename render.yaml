services:
  - type: web
    name: api-tarefas
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: https://leonardocarrilho.github.io

      - key: PUBLIC_ORIGIN
        sync: false
      - key: TRUSTED_PROXIES
        sync: false
      - key: TASK_API_TOKEN
        sync: false
